server {
    listen 80;
    server_name localhost 127.0.0.1;

    client_max_body_size 20m;

    # Docker embedded DNS; resolve upstreams dynamically after containers start.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set                $backend_upstream http://backend:5000;
        # No URI suffix here: preserve /api/auth/login and other API paths intact.
        proxy_pass         $backend_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        set        $backend_uploads_upstream http://backend:5000;
        # Preserve /uploads/products/<filename> instead of collapsing it to /uploads/.
        proxy_pass $backend_uploads_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Static frontend assets must never be handled by the SPA HTML fallback.
    location ^~ /assets/ {
        proxy_pass         http://frontend:80;
        proxy_set_header   Host $host;
        proxy_intercept_errors off;
    }

    location /admin/ {
        rewrite ^/admin/(.*)$ /$1 break;
        proxy_pass         http://admin:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://frontend:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
